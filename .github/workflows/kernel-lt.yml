name: kernel-lt

on:
  push:
    paths: [kernel/**, kernel.sh, build/**, tests/**, .github/workflows/kernel-lt.yml]
  workflow_dispatch:

concurrency:
  group: kernel-lt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The full el7-config build plus its container needs more than the runner's default free disk.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Build kernel-lt RPM
        run: ./kernel.sh build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-lt-rpm
          path: out/kernel-lt/*.rpm
          if-no-files-found: error

  boot-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-lt-rpm
          path: rpms
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils cloud-image-utils
      - name: Boot test
        run: ./tests/boot-test.sh rpms/kernel-lt-[0-9]*.x86_64.rpm "$RUNNER_TEMP/vm"
      - name: Console log
        if: always()
        run: tail -200 "$RUNNER_TEMP/vm/console.log" || true

  # GitHub raises no workflow_run for a run that GITHUB_TOKEN started, so a run the bump job
  # (or automerge-bump) dispatched would finish unseen by the watchdog and by automerge-bump.
  # Such a run does both jobs itself, from main's copy of the scripts.
  after:
    needs: [build, boot-test]
    if: always() && github.event_name == 'workflow_dispatch' && github.triggering_actor == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Report to the watchdog
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          SELF_REPORT: 1
          WORKFLOW_NAME: kernel-lt
          WORKFLOW_PATH: .github/workflows/kernel-lt.yml
          CONCLUSION: ${{ (needs.build.result == 'success' && needs.boot-test.result == 'success') && 'success' || ((needs.build.result == 'cancelled' || needs.boot-test.result == 'cancelled') && 'cancelled' || 'failure') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_BRANCH: ${{ github.ref_name }}
          EVENT: workflow_dispatch
        run: ./ci/watchdog-run.sh
      - name: Merge the bump if every check holds
        if: needs.build.result == 'success' && needs.boot-test.result == 'success' && startsWith(github.ref_name, 'kernel-lt-6.12.')
        run: |
          rc=0
          ./ci/automerge-bump.sh "$RUN_ID" || rc=$?
          # 3 is a refusal: the reason is on the pull request, and that is not a broken run.
          if [ "$rc" != 0 ] && [ "$rc" != 3 ]; then exit "$rc"; fi
