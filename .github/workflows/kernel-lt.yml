name: kernel-lt

on:
  push:
    paths: [kernel/**, kernel.sh, build/**, tests/**, .github/workflows/kernel-lt.yml]
  workflow_dispatch:

concurrency:
  group: kernel-lt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      # The full el7-config build plus its container needs more than the runner's default free disk.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Build kernel-lt RPM
        run: ./kernel.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-lt-rpm
          path: out/kernel-lt/*.rpm
          if-no-files-found: error

  boot-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kernel-lt-rpm
          path: rpms
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils cloud-image-utils
      - name: Boot test
        run: ./tests/boot-test.sh rpms/kernel-lt-[0-9]*.x86_64.rpm "$RUNNER_TEMP/vm"
      - name: Console log
        if: always()
        run: tail -200 "$RUNNER_TEMP/vm/console.log" || true
