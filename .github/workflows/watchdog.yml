name: watchdog

# Makes failures loud. A red scheduled run, a schedule that stopped running, main ahead of the
# signed repo, and a pull request nobody merged all used to be silent; each now has an issue.
on:
  workflow_run:
    workflows: [kernel-lt-bump, kernel-lt, backports, muertos-release, cve-survey, automerge-bump, claude-fix]
    types: [completed]
  schedule:
    - cron: '43 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  # read for the failed run's logs, write to start claude-fix
  actions: write

jobs:
  run:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: watchdog-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      # Always the default branch's copy of the script, never the run's own ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Open, update or close the ci-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: ./ci/watchdog-run.sh

  daily:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Silent schedules, unpublished versions, waiting pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ./ci/watchdog-daily.sh
